name: tv_clone_native
description: "A TradingView-like mobile trading application built with Flutter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # provider is a popular state management solution for Flutter.
  provider: ^6.0.5


  # http is a package that provides a set of high-level functions and classes
  # to make HTTP requests easier to work with.
  http: ^1.1.0


  # shared_preferences is a package that provides a persistent store for simple data.
  # It allows you to save key-value pairs on the device.
  # This is useful for storing user preferences or settings.
  # It is commonly used in Flutter applications to persist data across app launches.
  # The package provides a simple API to read and write data, and it handles the underlying storage mechanism.
  # For example, you can use it to save user preferences like theme settings or language choices.
  # The package is widely used in the Flutter community and is maintained by the Flutter team.
  # It is a reliable and efficient way to store small amounts of data on the device.
  # For more information, see https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.2.2

  # fl_chart is a powerful charting library for Flutter that allows you to create beautiful and interactive charts.
  # It supports various types of charts, including line charts, bar charts, pie charts, and more.
  # The library provides a simple and intuitive API for creating charts, making it easy to visualize data in your Flutter applications.
  fl_chart: ^0.65.0

  # intl is a package that provides internationalization and localization support for Flutter applications.
  # It allows you to format dates, numbers, and messages according to different locales.
  # The package includes utilities for parsing and formatting dates, numbers, and messages in a locale-aware manner.
  intl: ^0.18.1

  # flutter_svg is a package that allows you to render SVG (Scalable Vector Graphics) images in Flutter applications.
  # It provides a widget that can display SVG images, making it easy to include vector graphics in your Flutter UI.
  # The package supports various SVG features, including gradients, patterns, and transformations.
  # It is commonly used for displaying icons, logos, and other vector graphics in Flutter applications.
  # For more information, see https://pub.dev/packages/flutter_svg
  flutter_svg: ^2.0.9

  # cached_network_image is a package that provides a widget for displaying images from the network with caching support.
  # It allows you to load images from a URL and cache them locally, improving performance and reducing network usage.
  # The package provides a simple API for loading images, and it automatically handles caching and displaying placeholder images while the image is being loaded.
  # It is commonly used in Flutter applications to display images from remote sources, such as APIs or cloud storage.
  cached_network_image: ^3.3.0


# Development dependencies are packages that are only needed during development and testing.
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: fonts/Inter-Regular.ttf
  #       - asset: fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: fonts/Inter-Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
